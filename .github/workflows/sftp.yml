name: SFTP tool

on:
  push:
    branches:
      - claude/bedrockanarchy-sftp-sjfksb
    paths:
      - sftp-request.json

permissions:
  contents: read

jobs:
  sftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paramiko
        run: pip install paramiko

      - name: Read request file
        id: request
        run: |
          {
            echo "CMD=$(jq -r '.command // "list"' sftp-request.json)"
            echo "REMOTE_PATH=$(jq -r '.remote_path // "."' sftp-request.json)"
            echo "DEPTH=$(jq -r '.depth // 3' sftp-request.json)"
            echo "LOCAL_PATH=$(jq -r '.local_path // ""' sftp-request.json)"
          } >> "$GITHUB_ENV"

      - name: Run SFTP command
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python scripts/sftp_tool.py

      - name: Upload downloaded files as artifact
        if: env.CMD == 'get'
        uses: actions/upload-artifact@v4
        with:
          name: sftp-download
          path: sftp_download/
          if-no-files-found: warn
