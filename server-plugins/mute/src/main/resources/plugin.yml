name: BedrockAnarchyMute
version: '${project.version}'
main: org.bedrockanarchy.mute.MutePlugin
api-version: '1.20'
author: BedrockAnarchy
description: Per-player, persistent mute system for BedrockAnarchy (Paper + Geyser/Floodgate).
commands:
  pmute:
    description: Mute a player (permanently or for a duration).
    usage: /pmute <player> [duration] [reason]
    aliases: [mute, bamute]
    permission: bedrockanarchy.mute
  punmute:
    description: Unmute a player.
    usage: /punmute <player>
    aliases: [unmute]
    permission: bedrockanarchy.mute
  mutelist:
    description: List currently muted players.
    usage: /mutelist
    aliases: [muted, pmutelist]
    permission: bedrockanarchy.mute
permissions:
  bedrockanarchy.mute:
    description: Allows muting and unmuting players.
    default: op
  bedrockanarchy.mute.exempt:
    description: Players with this permission cannot be muted.
    default: false
